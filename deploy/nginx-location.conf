# Opios under a path of an existing site (here /opios), in that site's HTTPS server block,
# above its `location /`. Opios serves everything under /opios itself, so the path passes
# through unchanged.
#
# ^~ keeps a regex location for static files (\.(css|js|…)$) from claiming /opios/assets/….
# The add_header stops the site's own headers, its Content-Security-Policy above all, from being
# added on top of the ones Opios sends (nginx drops inherited add_headers in a block with its own).

location = /opios { return 301 /opios/; }

location ^~ /opios/ {
    client_max_body_size 25m;    # a large CSV import
    proxy_pass http://127.0.0.1:5340;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
